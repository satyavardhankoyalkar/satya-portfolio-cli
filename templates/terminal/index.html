<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Terminal Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Fira+Code:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #030508;
      --surface:   #080c14;
      --surface2:  #0d1422;
      --border:    rgba(0,255,180,0.12);
      --glow:      #00ffb4;
      --glow2:     #00cfff;
      --pink:      #ff2d78;
      --dim:       #3a5a4a;
      --dimmer:    #1e3028;
      --white:     #e8f5ee;
      --yellow:    #f0e040;
      --orange:    #ff8c42;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--glow);
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
    }

    /* ── Scanline overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0,0,0,0.18) 3px,
        rgba(0,0,0,0.18) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    /* ── Ambient glow bg ── */
    body::after {
      content: '';
      position: fixed;
      top: -200px; left: -200px;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(0,255,180,0.04) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: drift 20s ease-in-out infinite alternate;
    }

    @keyframes drift {
      from { transform: translate(0,0); }
      to   { transform: translate(200px, 150px); }
    }

    /* ── Layout ── */
    .os-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 16px;
      gap: 0;
    }

    /* ── Window chrome ── */
    .win {
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow:
        0 0 0 1px rgba(0,255,180,0.04),
        0 0 60px rgba(0,255,180,0.06),
        0 0 120px rgba(0,200,255,0.04),
        inset 0 1px 0 rgba(255,255,255,0.03);
      flex: 1;
      overflow: hidden;
    }

    .titlebar {
      display: flex;
      align-items: center;
      padding: 10px 16px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      gap: 12px;
      flex-shrink: 0;
    }

    .dots { display: flex; gap: 7px; }
    .dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      position: relative;
      cursor: default;
    }
    .dot::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .dot:hover::after { opacity: 1; }
    .dot-r { background: #ff5f57; box-shadow: 0 0 6px #ff5f5780; }
    .dot-y { background: #febc2e; box-shadow: 0 0 6px #febc2e80; }
    .dot-g { background: #28c840; box-shadow: 0 0 6px #28c84080; }

    .tab-row {
      display: flex;
      gap: 4px;
      margin-left: 8px;
      flex: 1;
    }

    .tab {
      padding: 4px 14px;
      border-radius: 6px 6px 0 0;
      background: var(--surface);
      color: var(--dim);
      font-size: 0.78rem;
      border: 1px solid var(--border);
      border-bottom: none;
      cursor: default;
      transition: all 0.2s;
    }
    .tab.active {
      background: var(--bg);
      color: var(--glow);
      border-color: var(--border);
    }

    .title-right {
      font-size: 0.75rem;
      color: var(--dim);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--glow);
      box-shadow: 0 0 8px var(--glow);
      animation: blink 2.5s ease-in-out infinite;
    }
    @keyframes blink {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.2; }
    }

    /* ── Output area ── */
    .output {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      scroll-behavior: smooth;
    }

    .output::-webkit-scrollbar { width: 6px; }
    .output::-webkit-scrollbar-track { background: transparent; }
    .output::-webkit-scrollbar-thumb {
      background: var(--dimmer);
      border-radius: 3px;
    }

    /* ── Input row ── */
    .input-zone {
      padding: 12px 24px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface2);
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .prompt-seg {
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 0;
      font-weight: 500;
    }

    .ps-user  { color: var(--glow); }
    .ps-at    { color: var(--dim); }
    .ps-host  { color: var(--glow2); }
    .ps-colon { color: var(--dim); }
    .ps-path  { color: var(--yellow); }
    .ps-git   { color: var(--pink); }
    .ps-sym   { color: var(--white); margin-left: 6px; }

    .cmd-input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--white);
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      flex: 1;
      caret-color: var(--glow);
      letter-spacing: 0.01em;
    }

    /* ── Output line types ── */
    .line {
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      animation: fadein 0.15s ease forwards;
    }

    @keyframes fadein {
      from { opacity: 0; transform: translateY(3px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .line-cmd {
      display: flex;
      gap: 10px;
      align-items: baseline;
      margin-top: 8px;
    }

    .line-blank { height: 6px; }

    /* ── Colors ── */
    .g  { color: var(--glow); }
    .c  { color: var(--glow2); }
    .p  { color: var(--pink); }
    .w  { color: var(--white); }
    .d  { color: var(--dim); }
    .y  { color: var(--yellow); }
    .o  { color: var(--orange); }

    /* ── ASCII logo ── */
    .logo {
      color: var(--glow2);
      font-size: 0.72rem;
      line-height: 1.25;
      letter-spacing: 0.05em;
      text-shadow: 0 0 20px rgba(0,207,255,0.4);
      margin-bottom: 4px;
    }

    /* ── Boot shimmer ── */
    .boot-line {
      color: var(--dim);
      font-size: 0.82rem;
    }
    .boot-ok   { color: var(--glow); }
    .boot-warn { color: var(--yellow); }

    /* ── Help table ── */
    .help-table {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 3px 24px;
      margin: 8px 0;
    }
    .hcmd { color: var(--glow2); font-weight: 500; }
    .hdesc{ color: var(--dim); }

    /* ── Sections ── */
    .section { margin: 6px 0; }

    .card {
      border-left: 2px solid var(--glow2);
      padding: 8px 0 8px 16px;
      margin: 8px 0;
      position: relative;
    }
    .card::before {
      content: '';
      position: absolute;
      left: -1px; top: 0; bottom: 0;
      width: 2px;
      background: linear-gradient(to bottom, var(--glow2), transparent);
      opacity: 0.4;
    }

    .card-title { color: var(--white); font-weight: 700; }
    .card-meta  { color: var(--pink); font-size: 0.82rem; margin-bottom: 4px; }
    .card-date  { color: var(--dim);  font-size: 0.78rem; }
    .card-body  { color: var(--glow); font-size: 0.88rem; margin-top: 6px; }
    .card-body li { list-style: none; padding-left: 0; }
    .card-body li::before { content: '▸ '; color: var(--glow2); }

    .tag {
      display: inline-block;
      background: rgba(0,255,180,0.07);
      border: 1px solid rgba(0,255,180,0.2);
      color: var(--glow);
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 0.75rem;
      margin: 2px 3px 2px 0;
    }
    .tag.lang  { border-color: rgba(0,207,255,0.3); color: var(--glow2); background: rgba(0,207,255,0.07); }
    .tag.tool  { border-color: rgba(255,45,120,0.3); color: var(--pink);  background: rgba(255,45,120,0.07); }

    /* ── Skills grid ── */
    .skill-grid {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 5px 20px;
      margin: 6px 0;
    }
    .sk-label { color: var(--glow2); font-weight: 500; white-space: nowrap; }
    .sk-bar-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .sk-tags { display: flex; flex-wrap: wrap; gap: 4px; }

    /* ── Links ── */
    .card-link {
      color: var(--glow2);
      font-size: 0.78rem;
      text-decoration: none;
      border: 1px solid rgba(0,207,255,0.3);
      padding: 2px 8px;
      border-radius: 3px;
      background: rgba(0,207,255,0.06);
      transition: all 0.2s;
      white-space: nowrap;
    }
    .card-link:hover {
      background: rgba(0,207,255,0.15);
      border-color: rgba(0,207,255,0.6);
      color: var(--white);
      text-decoration: none;
    }
    .card-link-dim {
      color: var(--dim);
      font-size: 0.78rem;
      border: 1px solid var(--dimmer);
      padding: 2px 8px;
      border-radius: 3px;
    }
    .cert-link { text-decoration: none; display: inline-flex; align-items: baseline; gap: 8px; }
    .cert-link:hover .card-link { background: rgba(0,207,255,0.15); }
    a { color: inherit; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .contact-row { display: flex; gap: 8px; align-items: baseline; margin: 4px 0; }
    .contact-key { color: var(--glow2); min-width: 80px; }
    .contact-val { color: var(--white); }
    .contact-val a { color: var(--glow); }
    .contact-val a:hover { color: var(--glow2); }

    /* ── Secret ── */
    .secret-text {
      color: var(--pink);
      text-shadow: 0 0 20px var(--pink);
      animation: glitch 0.1s step-end 5;
    }
    @keyframes glitch {
      0%,100% { transform: none; opacity: 1; }
      25%      { transform: translateX(-2px); opacity: 0.8; }
      75%      { transform: translateX(2px);  opacity: 0.9; }
    }

    /* ── Cursor blink ── */
    .cursor {
      display: inline-block;
      width: 8px; height: 15px;
      background: var(--glow);
      margin-left: 2px;
      vertical-align: middle;
      animation: cursor-blink 1s step-end infinite;
    }
    @keyframes cursor-blink {
      0%,100% { opacity: 1; }
      50%      { opacity: 0; }
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .os-wrapper { padding: 8px; }
      .output { padding: 14px 14px 8px; }
      .input-zone { padding: 10px 14px 14px; }
      .logo { font-size: 0.55rem; }
    }
  </style>
</head>
<body>
<div class="os-wrapper">
  <div class="win" id="win" onclick="focusInput()">
    <!-- Titlebar -->
    <div class="titlebar">
      <div class="dots">
        <div class="dot dot-r"></div>
        <div class="dot dot-y"></div>
        <div class="dot dot-g"></div>
      </div>
      <div class="tab-row">
<div class="tab active" id="terminalTab">
  terminal:~
</div>       <div class="tab d" style="font-size:0.72rem">zsh · ssh</div>
      </div>
      <div class="title-right">
        <div class="status-dot"></div>
        <span>connected</span>
      </div>
    </div>

    <!-- Output -->
    <div class="output" id="output"></div>

    <!-- Input -->
    <div class="input-zone">
      <div class="input-row">
        <span class="prompt-seg">
  <span class="ps-user" id="userPrompt"></span>
  <span class="ps-at">@</span>
  <span class="ps-host" id="hostPrompt"></span>
  <span class="ps-colon">:</span>
  <span class="ps-path">~</span>
  <span class="ps-git"> (main)</span>
  <span class="ps-sym">❯</span>
</span>
        <input id="cmd" class="cmd-input" type="text" autofocus autocomplete="off" spellcheck="false" placeholder="" />
      </div>
    </div>
  </div>
</div>

<script>
const out = document.getElementById('output');
const inp = document.getElementById('cmd');

function focusInput() { inp.focus(); }

// ── Helpers ──────────────────────────────────────────────
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

function appendLine(html, cls = 'line') {
  const d = el('div', cls, html);
  out.appendChild(d);
  scroll();
  return d;
}

function appendBlank() { out.appendChild(el('div', 'line-blank')); scroll(); }

function scroll() { out.scrollTop = out.scrollHeight; }

// ── Data ─────────────────────────────────────────────────
const ME = __DATA__;
document.getElementById("userPrompt").innerText =
  ME.username;

document.getElementById("hostPrompt").innerText =
  ME.hostname;

document.getElementById("terminalTab").innerText =
  `${ME.username}@${ME.hostname}: ~`;
// ── Commands ──────────────────────────────────────────────
const CMDS = {
  help:       'Show this manifest.',
  about:      'Professional summary.',
  skills:     'Language, framework and tool stack.',
  resume: 'Open resume.',
  experience: 'Work experience.',
  projects:   'Personal and side projects.',
  education:  'Academic background.',
  certs:      'Certifications.',
  contact:    'Reach me here.',
  clear:      'Clear the terminal.',
  whoami:     'You already know.',
  secret:     '???',
};

// ── Render commands ───────────────────────────────────────
function renderHelp() {
  appendBlank();
  appendLine(`<span class="c">Available commands</span> <span class="d">──────────────────────────────────</span>`);
  const wrap = el('div', 'line help-table');
  for (const [cmd, desc] of Object.entries(CMDS)) {
    wrap.innerHTML += `<span class="hcmd">${cmd}</span><span class="hdesc">${desc}</span>`;
  }
  out.appendChild(wrap);
  appendBlank();
  scroll();
}

function renderAbout() {
  appendLine(`<span class="c">// about</span>`);
    appendBlank();

  appendLine(ME.summary);
  appendBlank();
}

function renderSkills() {
  appendBlank();
  appendLine(`<span class="c">// skills</span>`);
  appendBlank();
  for (const row of ME.skills) {
    const tagsHTML = row.tags.map(t => `<span class="tag ${row.type}">${t}</span>`).join('');
    const rowEl = el('div', 'line skill-grid');
    rowEl.innerHTML = `<span class="sk-label">${row.label}</span><span class="sk-tags">${tagsHTML}</span>`;
    out.appendChild(rowEl);
  }
  appendBlank();
  scroll();
}

function renderExperience() {
  appendBlank();
  appendLine(`<span class="c">// experience</span>`);
  for (const exp of ME.experience) {
    const d = el('div', 'line card');
    const linkHTML = exp.link
  ? `<a href="${exp.link}"
       target="_blank"
       class="card-link">
       ${exp.linkLabel}
     </a>`
  : ``;
    d.innerHTML = `
      <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap">
        <div class="card-title">${exp.title}</div>
        ${linkHTML}
      </div>
      <div><span class="card-meta">${exp.org}</span> <span class="card-date">${exp.date}</span></div>
      <ul class="card-body">${exp.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>`;
    out.appendChild(d);
  }
  appendBlank();
  scroll();
}

function renderProjects() {
  appendBlank();
  appendLine(`<span class="c">// projects</span>`);
  ME.projects.forEach((p, i) => {
    const d = el('div', 'line card');
    const stackHTML = p.stack.map(s => `<span class="tag lang">${s}</span>`).join('');
    const linkHTML = p.link
      ? `<a href="${p.link}" target="_blank" class="card-link">${p.linkLabel}</a>`
      : `<span class="card-link-dim">${p.linkLabel}</span>`;
    d.innerHTML = `
      <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap">
        <div class="card-title">${String(i+1).padStart(2,'0')}. ${p.name}</div>
        ${linkHTML}
      </div>
      <div style="margin:4px 0">${stackHTML}</div>
      <ul class="card-body">${p.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>`;
    out.appendChild(d);
  });
  appendBlank();
  scroll();
}

function renderEducation() {
  
  appendLine(`<span class="c">// education</span>`);
  appendBlank();
  for (const e of ME.education) {
    const d = el('div', 'line card');
    d.innerHTML = `
      <div class="card-title">${e.title}</div>
      <div><span class="card-meta">${e.org}</span> <span class="card-date">${e.date}</span></div>
      ${e.extra ? `<div class="card-body" style="margin-top:4px">${e.extra}</div>` : ''}`;
    out.appendChild(d);
  }
  appendBlank();
  scroll();
}

function renderCerts() {
  appendBlank();
  appendLine(`<span class="c">// certifications</span>`);
  ME.certs.forEach(cert => {
    const d = el('div', 'line');
    d.innerHTML = `  <span class="y">✦</span> <a href="${cert.link}" target="_blank" class="cert-link"><span class="w">${cert.name}</span> <span class="card-link">↗ view badge</span></a>`;
    out.appendChild(d);
  });
  appendBlank();
  scroll();
}

function renderContact() {
  appendBlank();
  appendLine(`<span class="c">// contact</span>`);
  appendBlank();
  for (const r of ME.contact) {
    const d = el('div', 'line contact-row');
    d.innerHTML = `<span class="contact-key">${r.key}</span><span class="contact-val">${r.val}</span>`;
    out.appendChild(d);
  }
  appendBlank();
  scroll();
}

// ── Boot sequence ─────────────────────────────────────────
const LOGO = ME.logo;
const boot = [
  { html: `<span class="d">──────────────────────────────────────────────────────────</span>`, delay: 0 },
  { html: `<span class="d">  ${ME.name.toUpperCase()} OS v2.1.0 · kernel: node.js · arch: x86_64</span>`, delay: 120 },
  { html: `<span class="d">──────────────────────────────────────────────────────────</span>`, delay: 240 },
  { html: `<span class="d">[  0.001 ] </span><span class="g">Mounting portfolio filesystem...</span>`, delay: 380 },
  { html: `<span class="d">[  0.043 ] </span><span class="g">Loading identity module... </span><span class="boot-ok">OK</span>`, delay: 520 },
  { html: `<span class="d">[  0.089 ] </span><span class="g">Initializing PostgreSQL socket... </span><span class="boot-ok">CONNECTED</span>`, delay: 680 },
  { html: `<span class="d">[  0.124 ] </span><span class="g">GitHub API handshake... </span><span class="boot-ok">VERIFIED</span>`, delay: 860 },
  { html: `<span class="d">[  0.201 ] </span><span class="g">AWS EC2 ping... </span><span class="boot-ok">ALIVE</span>`, delay: 1040 },
  { html: `<span class="d">[  0.255 ] </span><span class="y">⚡ All systems nominal</span>`, delay: 1180 },
  { html: `<div class="logo">${LOGO.replace(/\n/g,'<br>')}</div>`, delay: 1420 },
{
  html: `
  <span class="w"
    style="font-size:1.05em;font-weight:700">
    ${ME.name}
  </span>
  <span class="d">·</span>
  <span class="c">${ME.role}</span>
  `,
  delay: 1700
}, { html: `<span class="d">Type </span><span class="c">help</span><span class="d"> to see available commands.</span>`, delay: 1900 },
  { html: `<span class="d">──────────────────────────────────────────────────────────</span>`, delay: 2060 },
];

boot.forEach(({ html, delay }) => {
  setTimeout(() => appendLine(html), delay);
});

// ── History ───────────────────────────────────────────────
let history = [], histIdx = -1;

// ── Input handler ─────────────────────────────────────────
inp.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (histIdx < history.length - 1) { histIdx++; inp.value = history[histIdx]; }
    return;
  }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (histIdx > 0) { histIdx--; inp.value = history[histIdx]; }
    else { histIdx = -1; inp.value = ''; }
    return;
  }
  if (e.key !== 'Enter') return;

  const raw = inp.value;
  const cmd = raw.trim().toLowerCase();
  inp.value = '';

  // Echo
  const echo = el('div', 'line line-cmd');
  echo.innerHTML = `
    <span class="prompt-seg" style="flex-shrink:0">
      <span class="ps-user">${ME.username}</span><span class="ps-at">@</span><span class="ps-host">${ME.hostname}</span><span class="ps-colon">:</span><span class="ps-path">~</span><span class="ps-git"> (main)</span><span class="ps-sym">❯</span>
    </span>
    <span class="w">${raw}</span>`;
  out.appendChild(echo);
  scroll();

  if (!cmd) return;

  history.unshift(cmd);
  histIdx = -1;

  switch (cmd) {
    case 'clear':
      out.innerHTML = '';
      break;
    case 'help':
      renderHelp();
      break;
    case 'about':
      renderAbout();
      break;
    case 'skills':
    case 'skill':
      renderSkills();
      break;
case 'experience':
case 'experiences':
    renderExperience();
      break;
    case 'projects':
    case 'project':
      renderProjects();
      break;
    case 'education':
      renderEducation();
      break;
    case 'cert':
case 'certs':
case 'certifications':
      renderCerts();
      break;
    case 'contact':
      renderContact();
      break;
      case 'resume':
  window.open(ME.resume, '_blank');
  break;
    case 'whoami':
      appendBlank();
      appendLine(`<span class="p">root</span>  <span class="d">// just kidding. you're a curious human.</span>`);
